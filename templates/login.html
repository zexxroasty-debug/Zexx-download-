<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="google-site-verification" content="nWbTHZLpoU2DygnNKOT4-qAqx_nrVi0tjNGYp86ETF8" />

    <meta name="viewport"

</head>

<body class="auth-page">

<div class="auth-card">

    <div class="brand">
        <div class="brand-logo">Z</div>
        <div>
            <div class="brand-name">ZEXX</div>
            <div class="brand-sub">DOWNLOAD</div>
        </div>
    </div>

    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to continue to ZEXX Download</p>

    {% if request.args.get("created") %}
    <div class="success-message">
        Account created successfully!
    </div>
    {% endif %}

    {% if error %}
    <div class="error-message">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">

        <div class="field">
            <label>Username</label>
            <div class="input-wrap">
                <span>👤</span>
                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>
        </div>

        <div class="field">
            <label>Password</label>
            <div class="input-wrap">
                <span>🔒</span>
                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
                <button
                    type="button"
                    class="show-btn"
                    onclick="togglePassword()"
                >Show</button>
            </div>
        </div>

        <label class="remember">
            <input type="checkbox" name="remember">
            <span>Remember me</span>
        </label>

        <button class="login-btn" type="submit">
            LOGIN <span>→</span>
        </button>

    </form>

    <div class="account-text">
        Don't have an account?
        <a href="{{ url_for('register') }}">Create Account</a>
    </div>

    <div class="footer-text">
        ZEXX DOWNLOAD • PRIVATE ACCESS
    </div>

</div>

<script>
function togglePassword() {
    const input = document.getElementById("password");
    const button = document.querySelector(".show-btn");

    if (input.type === "password") {
        input.type = "text";
        button.textContent = "Hide";
    } else {
        input.type = "password";
        button.textContent = "Show";
    }
}
</script>

</body>
</html>
